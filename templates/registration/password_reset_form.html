{% extends "base.html" %}
{% block title %}Recuperar senha{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 480px;">
  <h2 class="mb-3">Recuperar senha</h2>
  <p>Digite seu e-mail e enviaremos um link para criar uma nova senha.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="mb-3">
      <label for="id_email" class="form-label">E-mail</label>
      {{ form.email }}
    </div>
    <button type="submit" class="btn btn-primary w-100">Enviar link</button>
  </form>
</div>
{% endblock %}
