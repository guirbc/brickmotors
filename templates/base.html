<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}BrickMotors{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom border-secondary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">🚗 BrickMotors</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="nav" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="btn btn-warning btn-sm" href="/busca"><i class="bi bi-search"></i> Buscar</a></li>
          <li class="nav-item d-none d-lg-block"><span class="text-muted">|</span></li>
          <li class="nav-item dropdown">
            <a class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown">Mais</a>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
              <li><a class="dropdown-item" href="/repasses">Oportunidades (repasses)</a></li>
              <li><a class="dropdown-item" href="/admin/">Anunciar</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="mt-5 pt-4 pb-5 border-top border-secondary">
    <div class="container small text-muted">
      <div class="row g-4">
        <div class="col-lg-6">
          <strong>BrickMotors</strong> — marketplace regional de veículos. Simples, leve e pensado para o lojista do interior.
          <div class="mt-2">Suporte: <a href="mailto:contato@brickmotors.com">contato@brickmotors.com</a></div>
        </div>
        <div class="col-lg-6 text-lg-end">
          <span class="me-3">Termos</span>
          <span class="me-3">Privacidade</span>
          <span>© {% now "Y" %}</span>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
